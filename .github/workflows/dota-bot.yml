name: dota-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # запасной запуск на случай, если внешний будильник остановится
  workflow_dispatch:          # запуск вручную и из cron-job.org

concurrency: dota-bot

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Run bot
        run: python3 bot_once.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Save state
        run: |
          git config user.name "dota-bot"
          git config user.email "dota-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
