name: dota-bot

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут
  workflow_dispatch:          # ручной запуск кнопкой

concurrency: dota-bot

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        run: python bot_once.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Save state
        run: |
          git config user.name "dota-bot"
          git config user.email "dota-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
